<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="GutCare — a personal gut-health assistant: track symptoms, plan meals from the food you actually have, and get clear guidance for colon and digestive conditions.">
<title>GutCare — Personal Gut Health Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef;
  --bg-grad:radial-gradient(1200px 600px at 50% -10%, #e8f1ec 0%, rgba(232,241,236,0) 60%);
  --surface:#ffffff;
  --surface-2:#fbfaf7;
  --surface-3:#f2f0ea;
  --border:rgba(16,42,36,.10);
  --border-strong:rgba(16,42,36,.18);
  --text:#10211d;
  --dim:#5d6b66;
  --faint:#8b968f;
  --teal:#0f766e;
  --teal-2:#0b5c56;
  --teal-dim:#dcefea;
  --amber:#b45309;
  --amber-dim:#fbeedd;
  --rose:#9f1239;
  --rose-dim:#fbe4e9;
  --sage:#4d7c0f;
  --sage-dim:#e8f1d9;
  --shadow:0 1px 2px rgba(16,42,36,.04), 0 8px 24px -12px rgba(16,42,36,.18);
  --shadow-lg:0 2px 4px rgba(16,42,36,.05), 0 24px 48px -24px rgba(16,42,36,.28);
  --r:18px;
  --r-sm:12px;
  --nav-h:64px;
  --font:"Plus Jakarta Sans", "Segoe UI", "Helvetica Neue", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1412;
    --bg-grad:radial-gradient(1200px 600px at 50% -10%, #14302a 0%, rgba(20,48,42,0) 60%);
    --surface:#151f1c;
    --surface-2:#19241f;
    --surface-3:#1f2b26;
    --border:rgba(255,255,255,.09);
    --border-strong:rgba(255,255,255,.18);
    --text:#e9efec;
    --dim:#9aa8a2;
    --faint:#6f7c76;
    --teal:#37b3a2;
    --teal-2:#5fc9b8;
    --teal-dim:#12302b;
    --amber:#e0a15c;
    --amber-dim:#2e2213;
    --rose:#f2809b;
    --rose-dim:#33161d;
    --sage:#9ec46a;
    --sage-dim:#1e2a14;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -18px rgba(0,0,0,.8);
    --shadow-lg:0 2px 6px rgba(0,0,0,.4), 0 30px 60px -30px rgba(0,0,0,.9);
  }
}
html[lang="ar"]{--font:"Noto Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif}
html[lang="ar"] *{letter-spacing:0!important}
html[dir="rtl"] .label::before{order:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  background:var(--bg);
  background-image:var(--bg-grad);
  background-repeat:no-repeat;
  color:var(--text);
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.02em}
p{margin:0 0 .6em}
p:last-child{margin-bottom:0}
a{color:var(--teal)}
a.btn{text-decoration:none}

#app{
  max-width:520px;margin:0 auto;
  min-height:100dvh;
  padding:0 16px calc(var(--nav-h) + 28px);
  position:relative;
}
.screen{padding-top:18px;animation:fadeUp .32s cubic-bezier(.2,.7,.3,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
.topbar .hi{font-size:13px;color:var(--dim);font-weight:600;letter-spacing:.02em}
.topbar h1{font-size:22px;font-weight:800;letter-spacing:-.03em}
.avatar{
  width:42px;height:42px;border-radius:14px;flex:0 0 auto;
  background:linear-gradient(160deg,var(--teal),var(--teal-2));
  color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;
  box-shadow:var(--shadow);
}

/* ---------- section labels ---------- */
.label{
  font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);
  display:flex;align-items:center;gap:7px;margin:26px 0 10px;
}
.label::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--teal);flex:0 0 auto}
.label.amber::before{background:var(--amber)}
.label.rose::before{background:var(--rose)}
.label .sp{flex:1}
.label .lnk{font-family:var(--font);font-size:12px;letter-spacing:0;text-transform:none;color:var(--teal);font-weight:700}

/* ---------- cards ---------- */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:16px;box-shadow:var(--shadow);
}
.card + .card{margin-top:10px}
.card--hero{
  background:linear-gradient(165deg,var(--surface) 0%,var(--surface-2) 100%);
  box-shadow:var(--shadow-lg);padding:20px;border-radius:22px;
}
.card--flat{box-shadow:none;background:var(--surface-2)}
.card--recessed{background:var(--surface-3);box-shadow:none;border-style:dashed}
.card--rose{background:var(--rose-dim);border-color:rgba(159,18,57,.22)}
.card--amber{background:var(--amber-dim);border-color:rgba(180,83,9,.22)}
.card--teal{background:var(--teal-dim);border-color:rgba(15,118,110,.2)}
.card h3{font-size:15px;font-weight:750}
.card .sub{font-size:13px;color:var(--dim);margin-top:3px}

/* ---------- score hero ---------- */
.score-wrap{display:flex;gap:18px;align-items:center}
.ring{position:relative;width:112px;height:112px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg);display:block}
.ring .val{
  position:absolute;inset:0;display:grid;place-content:center;text-align:center;
}
.ring .val b{font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1}
.ring .val span{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);display:block;margin-top:3px}
.score-meta{min-width:0;flex:1}
.score-meta .grade{font-size:17px;font-weight:800;letter-spacing:-.02em}
.score-meta .note{font-size:12.5px;color:var(--dim);margin-top:4px;line-height:1.45}

/* ---------- bars ---------- */
.bars{display:grid;gap:11px;margin-top:16px}
.bar-row{display:grid;grid-template-columns:74px 1fr 34px;align-items:center;gap:10px}
.bar-row .nm{font-size:11.5px;font-weight:700;color:var(--dim);letter-spacing:.01em}
.bar-row .num{font-family:var(--mono);font-size:11.5px;font-weight:600;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
.track{height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.fill{height:100%;border-radius:99px;background:var(--teal);transition:width .5s cubic-bezier(.2,.7,.3,1)}
.fill.amber{background:var(--amber)}
.fill.rose{background:var(--rose)}
.fill.sage{background:var(--sage)}

/* ---------- chips & pills ---------- */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  font-size:12.5px;font-weight:650;padding:7px 12px;border-radius:99px;
  background:var(--surface-3);color:var(--text);border:1px solid transparent;
  transition:transform .12s, background .15s;
}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--teal);color:#fff;border-color:var(--teal)}
.chip.sm{font-size:11.5px;padding:5px 10px}
.badge{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 8px;border-radius:7px;background:var(--surface-3);color:var(--dim);
}
.badge.good{background:var(--sage-dim);color:var(--sage)}
.badge.warn{background:var(--amber-dim);color:var(--amber)}
.badge.bad{background:var(--rose-dim);color:var(--rose)}
.badge.teal{background:var(--teal-dim);color:var(--teal)}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 18px;border-radius:14px;font-weight:750;font-size:14.5px;
  background:var(--surface-3);color:var(--text);transition:transform .12s,filter .15s;
  border:1px solid transparent;
}
.btn:active{transform:scale(.975)}
.btn-primary{background:var(--teal);color:#fff;box-shadow:0 8px 20px -10px rgba(15,118,110,.9)}
.btn-primary:active{filter:brightness(.95)}
.btn-ghost{background:transparent;border:1px solid var(--border-strong);color:var(--text)}
.btn-amber{background:var(--amber);color:#fff}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:11px}
.btn-block{display:flex;width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}

/* ---------- forms ---------- */
.field{margin-bottom:14px}
.field > label{display:block;font-size:12px;font-weight:700;color:var(--dim);margin-bottom:6px;letter-spacing:.01em}
.input,textarea.input,select.input{
  width:100%;padding:12px 13px;border-radius:12px;
  background:var(--surface-2);border:1px solid var(--border-strong);
  font-size:15px;outline:none;transition:border-color .15s, box-shadow .15s;
  -webkit-appearance:none;appearance:none;
}
.input:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-dim)}
select.input{background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
textarea.input{min-height:76px;resize:vertical;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:11.5px;color:var(--faint);margin-top:5px;line-height:1.4}

/* segmented */
.seg{display:grid;gap:6px;grid-template-columns:repeat(var(--n,4),1fr)}
.seg button{
  padding:10px 4px;border-radius:11px;background:var(--surface-2);
  border:1px solid var(--border);font-size:12px;font-weight:650;color:var(--dim);
  transition:all .14s;line-height:1.25;
}
.seg button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.seg.amber button[aria-pressed="true"]{background:var(--amber);border-color:var(--amber)}
.seg.rose button[aria-pressed="true"]{background:var(--rose);border-color:var(--rose)}

/* slider */
.slider-row{display:flex;align-items:center;gap:12px}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;
}
input[type=range]::-webkit-slider-runnable-track{height:7px;border-radius:99px;background:var(--surface-3)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--teal);
  border:3px solid var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.2);margin-top:-8.5px;
}
input[type=range]::-moz-range-track{height:7px;border-radius:99px;background:var(--surface-3)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:3px solid var(--surface);border-radius:50%;background:var(--teal)}

/* ---------- timeline / meals ---------- */
.tl{position:relative;padding-left:0}
.tl-item{
  display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;
  padding:12px 0;border-bottom:1px solid var(--border);
}
.tl-item:last-child{border-bottom:none}
.tl-time{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--dim);padding-top:2px}
.tl-body{min-width:0}
.tl-body .t{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tl-body .d{font-size:12.5px;color:var(--dim);margin-top:2px;line-height:1.45}
.tl-item.done .t{opacity:.55;text-decoration:line-through;text-decoration-thickness:1.5px}
.tl-item.done .tl-time{color:var(--sage)}
.check{
  width:26px;height:26px;border-radius:9px;border:2px solid var(--border-strong);
  display:grid;place-items:center;flex:0 0 auto;background:var(--surface);
  transition:all .15s;
}
.check.on{background:var(--teal);border-color:var(--teal)}
.check svg{width:14px;height:14px;stroke:#fff;opacity:0;transition:opacity .15s}
.check.on svg{opacity:1}

/* list rows */
.row{
  display:flex;align-items:center;gap:12px;padding:13px 0;
  border-bottom:1px solid var(--border);
}
.row:last-child{border-bottom:none}
.row .grow{flex:1;min-width:0}
.row .ttl{font-size:14px;font-weight:700}
.row .ds{font-size:12.5px;color:var(--dim);margin-top:1px}
.row .chev{color:var(--faint);font-size:18px;flex:0 0 auto}

/* ---------- bottom nav ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:color-mix(in srgb, var(--surface) 88%, transparent);
  -webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);
  border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-inner{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.nav-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--faint);font-size:10px;font-weight:700;letter-spacing:.01em;
  transition:color .15s;padding:0;
}
.nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav-btn[aria-current="page"]{color:var(--teal)}
.nav-btn:active{opacity:.7}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));
  transform:translate(-50%,20px);z-index:60;
  background:#10211d;color:#fff;padding:12px 18px;border-radius:14px;
  font-size:13.5px;font-weight:650;box-shadow:var(--shadow-lg);
  opacity:0;pointer-events:none;transition:all .28s cubic-bezier(.2,.7,.3,1);
  max-width:calc(100% - 32px);text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- misc ---------- */
.empty{text-align:center;padding:26px 12px;color:var(--dim)}
.empty .big{font-size:15px;font-weight:750;color:var(--text);margin-bottom:4px}
.empty p{font-size:13px}
.divider{height:1px;background:var(--border);margin:16px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--dim)}
.kv .v{font-weight:700;text-align:right}
.spark{display:flex;align-items:flex-end;gap:3px;height:56px;margin-top:6px}
.spark i{flex:1;background:var(--teal);border-radius:3px 3px 0 0;min-height:3px;opacity:.85}
.spark i.low{background:var(--amber)}
.spark i.bad{background:var(--rose)}
.spark-x{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-top:5px;letter-spacing:.06em}
.report{
  font-size:14px;line-height:1.65;white-space:pre-wrap;overflow-wrap:break-word;
}
.report strong{font-weight:750}
.steps{display:flex;gap:6px;margin-bottom:18px}
.steps i{height:4px;flex:1;border-radius:99px;background:var(--surface-3)}
.steps i.on{background:var(--teal)}
.flag{display:flex;gap:10px;align-items:flex-start}
.flag .dot{width:8px;height:8px;border-radius:50%;background:var(--rose);margin-top:7px;flex:0 0 auto}
.mini{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.scrollx{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
.foodrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.foodrow:last-child{border-bottom:none}
.foodrow .nm{flex:1;min-width:0;font-size:13.5px;font-weight:650}
.foodrow .nm small{display:block;font-weight:500;color:var(--dim);font-size:11.5px;margin-top:1px}
.dotscore{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.tap{transition:opacity .15s}.tap:active{opacity:.6}

/* ---------- alarm overlay ---------- */
.alarm{position:fixed;inset:0;z-index:100;background:rgba(8,20,18,.94);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .22s ease both}
.alarm-inner{width:100%;max-width:360px;text-align:center}
.alarm-time{font-family:var(--mono);font-size:13px;letter-spacing:.2em;color:#8fb3ab}
.alarm-inner h2{font-size:27px;margin:12px 0 8px;color:#fff;letter-spacing:-.02em}
.alarm-inner p{font-size:15px;color:rgba(255,255,255,.82);margin-bottom:28px}
.alarm-inner .btn{width:100%;margin-bottom:10px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.22)}
.alarm-inner .btn-primary{background:#0f766e;border-color:transparent;box-shadow:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:96px}
.bubble{max-width:86%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:break-word}
.bubble.user{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:6px}
.bubble.coach{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:6px;box-shadow:var(--shadow)}
.msg{display:flex;flex-direction:column;max-width:88%}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg.coach{align-self:flex-start;align-items:flex-start}
.msg .bubble{max-width:100%}
.stamp{font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-top:4px;letter-spacing:.04em}
.qcard{border-left:3px solid var(--teal)}
.qcard .q{font-size:14.5px;font-weight:700;margin-bottom:10px}
.chatbar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));z-index:35;
  padding:9px 16px;background:color-mix(in srgb, var(--surface) 94%, transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--border)}
.chatbar-inner{max-width:520px;margin:0 auto;display:flex;gap:8px;align-items:center}
.chatbar input{flex:1;min-width:0;padding:12px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--border-strong);outline:none}
.chatbar input:focus{border-color:var(--teal)}
.send{width:46px;height:44px;border-radius:14px;background:var(--teal);display:grid;place-items:center;flex:0 0 auto}
.send svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* ============================================================
   i18n — data
   English is the source language of the interface. Static UI text
   is translated after render (UI map). Text built in JavaScript
   uses TXT keys via t().
   ============================================================ */
const LANGS = [
  { id: "en", label: "English", locale: "en-GB" },
  { id: "fr", label: "Français", locale: "fr-FR" },
  { id: "ar", label: "العربية", locale: "ar-u-nu-latn" }
];
let LANG = "en";

/* ---------- food names ---------- */
const FOOD_I18N = {
  fr: {
    rice: "Riz blanc", "brown-rice": "Riz complet", "bread-white": "Pain blanc", "bread-whole": "Pain complet",
    bulgur: "Boulgour", oats: "Flocons d'avoine", pasta: "Pâtes", potato: "Pomme de terre (bouillie)",
    "sweet-potato": "Patate douce", couscous: "Couscous", corn: "Maïs doux", lentils: "Lentilles",
    chickpeas: "Pois chiches", beans: "Haricots blancs ou rouges", ful: "Ful medames (fèves)", egg: "Œufs",

/* ============================================================
   i18n — runtime
   ============================================================ */
function t(key, vars) {
  const pack = TXT[LANG] || {};
  let s = pack[key];
  if (s === undefined) s = (TXT.en && TXT.en[key]) !== undefined ? TXT.en[key] : key;
  if (!vars) return s;
  return s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined && vars[k] !== null ? String(vars[k]) : m));
}

function tIn(lang, key, vars) {
  const pack = TXT[lang] || TXT.en || {};
  let s = pack[key];
  if (s === undefined) s = (TXT.en && TXT.en[key]) !== undefined ? TXT.en[key] : key;
  if (!vars) return s;
  return s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined && vars[k] !== null ? String(vars[k]) : m));
}

function locale() {
  const l = LANGS.find((x) => x.id === LANG);
  return l ? l.locale : "en-GB";
}

function isRTL() { return LANG === "ar"; }

/* translate a rendered phrase, allowing composed strings */
function trPhrase(s) {
  const d = UI[LANG];
  if (!d) return s;
  if (d[s] !== undefined) return d[s];

  // "Question 3 of 9"
  let m = s.match(/^Question (\d+) of (\d+)$/);
  if (m) return t("question.of", { a: m[1], b: m[2] });
  // "18 items"
  m = s.match(/^(\d+) items?$/);
  if (m) return t("units.items", { n: m[1] });
  // "3 / 8 glasses"
  m = s.match(/^([\d.]+) \/ 8 glasses$/);
  if (m) return t("units.glasses", { n: m[1] });
  // "Selected: none yet" / "Current: Constipation"
  m = s.match(/^(Selected|Current): (.+)$/);
  if (m) {
    const head = d[m[1] + ":"] !== undefined ? d[m[1] + ":"] : m[1] + ":";
    return head + " " + m[2];
  }

  // composed phrases — translate the parts
  const seps = [" · ", " — "];
  for (let i = 0; i < seps.length; i++) {
    const sep = seps[i];
    if (s.indexOf(sep) > -1) {
      let changed = false;
      const parts = s.split(sep).map((p) => {
        if (d[p] !== undefined) { changed = true; return d[p]; }
        return p;
      });
      if (changed) return parts.join(sep);
    }
  }
  return s;
}

function applyI18n() {
  const dir = isRTL() ? "rtl" : "ltr";
  document.documentElement.setAttribute("lang", LANG);
  document.documentElement.setAttribute("dir", dir);
  if (LANG === "en") return;

  // text nodes
  const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      const p = node.parentNode;
      if (!p) return NodeFilter.FILTER_REJECT;
      const tag = p.nodeName;
      if (tag === "SCRIPT" || tag === "STYLE" || tag === "TEXTAREA") return NodeFilter.FILTER_REJECT;
      if (p.closest && p.closest(".report")) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach((n) => {
    const raw = n.nodeValue;
    const key = raw.trim();
    const tr = trPhrase(key);
    if (tr && tr !== key) n.nodeValue = raw.replace(key, tr);
  });

  // attributes
  ["placeholder", "aria-label", "title"].forEach((attr) => {
    document.querySelectorAll("[" + attr + "]").forEach((el) => {
      const v = el.getAttribute(attr);
      if (!v) return;
      const tr = trPhrase(v.trim());
      if (tr && tr !== v.trim()) el.setAttribute(attr, tr);
    });
  });
}

function setLang(l) {
  LANG = l;
  if (state && state.settings) { state.settings.lang = l; save(); }
  applyI18n();
  render();
  toast(t("toast.lang"));
}

function langChips() {
  return '<div class="chips" style="margin-top:6px">' + LANGS.map((l) =>
    '<button class="chip sm" aria-pressed="' + (LANG === l.id) + '" data-act="setLang" data-lang="' + l.id + '">' + esc(l.label) + '</button>').join("") + "</div>";
}

/* pick a language from the phone on first run */
function detectLang() {
  const n = (navigator.language || navigator.userLanguage || "en").toLowerCase();
  if (n.indexOf("ar") === 0) return "ar";
  if (n.indexOf("fr") === 0) return "fr";
  return "en";
}

/* ============================================================
   SCORING ENGINE
   ============================================================ */
function gutContext(date) {
  const day = getDay(date);
  const bristol = day.log && day.log.bristol ? Number(day.log.bristol) : null;
  const p = state.profile;
  return {
    conditions: p.conditions || [],
    bristol,
    bloating: day.log && day.log.bloating != null ? Number(day.log.bloating) : 1,
    flare: !!(day.log && Number(day.log.bristol) >= 6)
  };
}

function foodScore(f, ctx) {
  const has = (c) => ctx.conditions.indexOf(c) > -1;
  const ibs = has("ibs-c") || has("ibs-d") || has("ibs-m") || has("unknown");
  const constip = has("constipation") || has("ibs-c") || has("hemorrhoids") || (ctx.bristol != null && ctx.bristol <= 2);
  const loose = has("ibs-d") || (has("ibd-uc") || has("ibd-crohn")) && ctx.flare || (ctx.bristol != null && ctx.bristol >= 6);
  let s = 66;
  const fl = f.flags || [];

  // fibre balance
  if (constip) s += f.fiber * 5.5;
  if (loose) { s -= f.fiber * 2.5; s += (3 - f.res) * 2; }
  if (has("hemorrhoids")) s += f.fiber * 2;

  // fermentable carbohydrates — IBS & functional gut
  if (ibs) s -= f.fodmap * 5.5;
  if (has("ibs-d")) s -= f.fodmap * 2;

  // residue — IBD / diverticular in a flare
  if ((has("ibd-uc") || has("ibd-crohn")) && ctx.flare) s -= f.res * 5;
  if (has("diverticular") && ctx.flare) s -= f.res * 3;

  // generic irritation
  s -= f.irrit * 7;
  if (fl.indexOf("fried") > -1) s -= 13;
  if (fl.indexOf("spicy") > -1) s -= 9;
  if (fl.indexOf("carbonated") > -1) s -= 7;
  if (fl.indexOf("processed") > -1) s -= 6;
  if (fl.indexOf("caffeine") > -1) s -= loose ? 9 : 3;
  if (fl.indexOf("acid") > -1 && (has("gerd") || has("gastritis"))) s -= 8;
  if (fl.indexOf("sugar") > -1) s -= 4;
  if (fl.indexOf("salt") > -1) s -= 2;
  if (fl.indexOf("gas") > -1 && ctx.bloating >= 2) s -= 7;
  if (fl.indexOf("seeds") > -1 && has("diverticular")) s -= ctx.flare ? 9 : 3;
  if (fl.indexOf("seeds") > -1 && (has("ibd-uc") || has("ibd-crohn"))) s -= 5;

  // positives
  if (fl.indexOf("probiotic") > -1) s += 7;
  if (has("gerd") && f.fiber >= 2) s += 2;
  if (f.water >= 3) s += 2;

  // hard exclusions
  if (has("celiac") && fl.indexOf("gluten") > -1) return 4;
  if (has("lactose") && fl.indexOf("lactose") > -1) return 6;

  return clamp(Math.round(s));
}

/* ============================================================
   PLAN BUILDER
   ============================================================ */
const SLOTS = [
  { id: "breakfast", time: "07:30", label: "Breakfast", cats: ["carb", "dairy", "fruit"] },
  { id: "snack1", time: "10:30", label: "Mid-morning", cats: ["fruit"] },
  { id: "lunch", time: "13:00", label: "Lunch", cats: ["protein", "carb", "veg"] },
  { id: "snack2", time: "16:30", label: "Afternoon", cats: ["fruit", "fat"] },
  { id: "dinner", time: "19:00", label: "Dinner", cats: ["protein", "veg", "carb"] }
];

function buildPlan(date) {
  const ctx = gutContext(date);
  const avail = (state.pantry || []).filter((id) => FOOD[id]);
  const used = {};
  const picks = [];
  SLOTS.forEach((slot) => {
    slot.cats.forEach((cat) => {
      const pool = avail.filter((id) => FOOD[id].cat === cat && !used[id]);
      if (!pool.length) return;
      pool.sort((a, b) => foodScore(FOOD[b], ctx) - foodScore(FOOD[a], ctx));
      const pick = pool[0];
      if (foodScore(FOOD[pick], ctx) < 18) return;
      used[pick] = true;
      picks.push({ slot: slot.id, time: slot.time, foodId: pick });
    });
  });
  return picks;
}

function dailyTasks(date) {
  const ctx = gutContext(date);
  const has = (c) => ctx.conditions.indexOf(c) > -1;
  const mk = (k) => ({ id: k, text: t("task." + k), why: t("task." + k + ".w") });
  const out = [mk("water8"), mk("walk"), mk("breathe"), mk("sleep")];
  if (has("constipation") || has("ibs-c") || has("hemorrhoids")) { out.push(mk("toilet"), mk("oil")); }
  if (has("ibs-c") || has("ibs-d") || has("ibs-m") || has("unknown")) { out.push(mk("chew"), mk("gap")); }
  if (has("ibd-uc") || has("ibd-crohn")) { out.push(mk("meds"), mk("rest")); }
  if (has("hemorrhoids")) out.push(mk("nophone"));
  if (has("gerd") || has("gastritis")) out.push(mk("upright"));
  if (has("lactose")) out.push(mk("dairy"));
  return out;
}

/* ============================================================
   DAY ANALYSIS
   ============================================================ */
function computeDay(date) {
  const d = getDay(date);
  const ctx = gutContext(date);
  const log = d.log || {};
  const out = { has: { comfort: false, diet: false, fibre: false, hydration: false, routine: false, activity: false } };

  // comfort
  const parts = [];
  if (log.bristol) {
    const map = { 1: 30, 2: 55, 3: 90, 4: 100, 5: 76, 6: 46, 7: 24 };
    parts.push(map[Number(log.bristol)] || 60);
  }
  if (log.pain != null) parts.push(100 - Number(log.pain) * 26);
  if (log.bloating != null) parts.push(100 - Number(log.bloating) * 24);
  if (log.gas != null) parts.push(100 - Number(log.gas) * 22);
  if (log.urgency != null) parts.push(100 - Number(log.urgency) * 24);
  if (parts.length) { out.comfort = clamp(Math.round(parts.reduce((a, b) => a + b, 0) / parts.length)); out.has.comfort = true; }

  // diet quality
  if (d.meals.length) {
    const sc = d.meals.map((m) => foodScore(FOOD[m.foodId] || { fiber: 1, fodmap: 1, irrit: 1, res: 1, water: 0, flags: [] }, ctx));
    out.diet = clamp(Math.round(sc.reduce((a, b) => a + b, 0) / sc.length));
    out.has.diet = true;
    // fibre grams estimate (~4g per fibre point)
    const grams = d.meals.reduce((a, m) => a + ((FOOD[m.foodId] || {}).fiber || 0) * 4, 0);
    out.fibreG = Math.round(grams);
    out.fibre = clamp(Math.round((grams / 28) * 100));
    out.has.fibre = true;
    const irr = d.meals.reduce((a, m) => a + ((FOOD[m.foodId] || {}).irrit || 0), 0) / d.meals.length;
    out.irritLoad = Math.round(irr * 10) / 10;
  }

  // hydration
  out.hydration = clamp(Math.round((d.water / 8) * 100));
  out.has.hydration = d.water > 0 || d.meals.length > 0;

  // routine
  const tasks = dailyTasks(date);
  const doneN = tasks.filter((t) => d.tasks[t.id]).length;
  const mealRatio = SLOTS.length ? Math.min(1, d.meals.length / 3) : 0;
  out.tasksDone = doneN; out.tasksTotal = tasks.length;
  out.routine = clamp(Math.round((doneN / tasks.length) * 70 + mealRatio * 30));
  out.has.routine = true;

  // activity
  if (log.activityMin != null || log.steps != null) {
    const bySteps = log.steps ? (Number(log.steps) / 6000) * 100 : 0;
    const byMin = log.activityMin ? (Number(log.activityMin) / 30) * 100 : 0;
    out.activity = clamp(Math.round(Math.max(bySteps, byMin)));
    out.has.activity = true;
  }

  // overall
  const W = { comfort: 30, diet: 24, fibre: 12, hydration: 12, routine: 12, activity: 10 };
  let sum = 0, wsum = 0;
  Object.keys(W).forEach((k) => { if (out.has[k]) { sum += out[k] * W[k]; wsum += W[k]; } });
  out.overall = wsum ? Math.round(sum / wsum) : 0;
  out.logged = !!(log.bristol || d.meals.length);
  return out;
}

function overallSeries(n = 14) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const k = addDays(todayKey(), -i);
    const c = computeDay(k);
    out.push({ k, v: c.overall, logged: c.logged });
  }
  return out;
}

function suggestConditions(a) {
  const sc = {}; const why = {};
  const add = (id, n, r) => { sc[id] = (sc[id] || 0) + n; (why[id] = why[id] || []).push(r); };
  const f = Number(a.freq), b = Number(a.bristol) + 1;

  if (f === 0) add("constipation", 3, t("sugg.freq"));
  if (b <= 2) add("constipation", 3, t("sugg.hard"));
  if (b === 3) add("constipation", 1, t("sugg.firm"));
  if (a.strain === "Often") add("constipation", 2, t("sugg.strain"));
  if (a.strain === "Often") add("hemorrhoids", 2, t("sugg.strain2"));
  if (b >= 6 || f === 4) add("ibs-d", 3, t("sugg.loose"));
  if (b <= 2 && b >= 1) add("ibs-c", 2, t("sugg.hardibs"));
  if (a.urgency === "Often") add("ibs-d", 2, t("sugg.urgency"));
  if ((b <= 2 || b >= 6) && a.bloat !== "None") add("ibs-m", 2, t("sugg.mixed"));
  if (a.bloat !== "None") { add("ibs-c", 1, t("sugg.bloat")); add("ibs-d", 1, t("sugg.bloat")); add("unknown", 1, t("sugg.bloat2")); }
  if (a.relief === "Yes") { add("ibs-c", 2, t("sugg.relief")); add("ibs-d", 2, t("sugg.relief")); }
  if (a.blood === "Yes") { add("hemorrhoids", 2, t("sugg.blood")); add("ibd-uc", 3, t("sugg.blood2")); }
  if (a.blood === "Not sure") add("hemorrhoids", 1, t("sugg.blood3"));
  if (a.dairy === "Yes") add("lactose", 4, t("sugg.dairy"));
  if (a.gluten === "Yes") add("celiac", 3, t("sugg.gluten"));
  if (a.bloat === "Severe") add("ibd-uc", 1, t("sugg.marked"));
  if (a.relief === "No pain" && a.bloat === "None" && f === 2 && b === 4) add("none", 3, t("sugg.regular"));

  const ranked = Object.keys(sc).sort((x, y) => sc[y] - sc[x]).slice(0, 3)
    .map((id) => ({ id, score: sc[id], reasons: why[id].slice(0, 3) }));
  return ranked.length ? ranked : [{ id: "unknown", score: 1, reasons: [t("sugg.none")] }];
}

function backfillEvents() {

  const out = [];

      t.setHours(Number(parts[0]) || 12, Number(parts[1]) || 0, 0, 0);

    });
    if (d.water) {
      const t = new Date(k + "T20:00:00");
      out.push({ t: t.getTime(), k: "water", l: d.water + "/8 glasses" });
    }
    if (d.log) {

    }
  });
  out.sort((a, b) => a.t - b.t);
  state.events = out.slice(-800);
}

function rhythm() {
  return [
    { id: "w1", h: 7, kind: "water", n: 2 },
    { id: "bf", h: 7.5, kind: "meal", slot: "breakfast" },
    { id: "walk", h: 9, kind: "task", task: "walk" },
    { id: "w2", h: 11, kind: "water", n: 4 },
    { id: "lunch", h: 13, kind: "meal", slot: "lunch" },
    { id: "w3", h: 16, kind: "water", n: 6 },
    { id: "dinner", h: 19, kind: "meal", slot: "dinner" },
    { id: "checkin", h: 20.5, kind: "checkin" },
    { id: "wind", h: 21.5, kind: "task", task: "breathe" },
    { id: "sleep", h: 22.5, kind: "task", task: "sleep" }
  ];
}

function plannedFor(slot) {
  const d = getDay(todayKey());
  const p = (d.plan || []).filter((x) => x.slot === slot);
  if (!p.length) return null;
  const eaten = d.meals.filter((m) => m.slot === slot).length;
  return p[Math.min(eaten, p.length - 1)];
}

function itemTitle(it) {
  if (it.kind === "water") return t("act.water", { n: 2 });
  if (it.kind === "meal") {
    const p = plannedFor(it.slot);
    return p ? t("act.meal", { f: foodName(p.foodId) }) : t("act.mealAny");
  }
  if (it.kind === "checkin") return t("act.checkin");
  if (it.task === "walk") return t("task.walk");
  if (it.task === "breathe") return t("task.breathe");
  if (it.task === "sleep") return t("task.sleep");
  return t("task." + it.task);
}

function itemWhy(it) {
  if (it.kind === "water") return t("act.water.why");
  if (it.kind === "meal") {
    const p = plannedFor(it.slot);
    return p ? (FOOD[p.foodId] ? foodWhy(FOOD[p.foodId], gutContext(todayKey())) : "") : t("act.mealAny.why");
  }
  if (it.kind === "checkin") return t("act.checkin.why");
  return t("task." + it.task + ".w");
}

function itemDone(it, d) {
  if (it.kind === "water") return d.water >= it.n;
  if (it.kind === "meal") return d.meals.some((m) => m.slot === it.slot);
  if (it.kind === "checkin") return !!d.log;
  return !!d.tasks[it.task];
}

function markRhythm(id) {
  const k = todayKey(), d = getDay(k);
  const it = rhythm().find((x) => x.id === id);
  if (!it) return;
  if (it.kind === "water") { d.water = Math.min(8, d.water + 2); logEvent("water", "+2 glasses (now " + d.water + "/8)"); }
  else if (it.kind === "meal") {
    const p = plannedFor(it.slot);
    if (p) { d.meals.push({ id: uid(), foodId: p.foodId, slot: p.slot, time: p.time, key: p.slot + ":" + p.foodId }); logEvent("food", (FOOD[p.foodId] ? FOOD[p.foodId].name : p.foodId) + " (" + p.slot + ")"); }
  } else if (it.kind === "task") { d.tasks[it.task] = true; logEvent("activity", it.task); }
  else if (it.kind === "checkin") { save(); ui.sub = "checkin"; return; }
  save();
}

function postponeItem(id) {
  state.settings.postpone = state.settings.postpone || {};
  state.settings.postpone[id] = Date.now() + 20 * 60000;
  save();
}

function currentItem() {
  const d = getDay(todayKey());
  const now = new Date().getHours() + new Date().getMinutes() / 60;
  const post = state.settings.postpone || {};
  const open = rhythm().filter((it) => !itemDone(it, d) && !(post[it.id] && post[it.id] > Date.now()));
  if (!open.length) return { allDone: true };
  const due = open.filter((it) => it.h <= now + 0.25);
  if (due.length) return { item: due[0] };
  return { item: open[0], soon: true };
}

function tomorrowAdvice(lang) {
  const LG = lang || LANG;
  const c = computeDay(todayKey());
  const p = state.profile;
  const out = [];
  const has = (x) => p.conditions.indexOf(x) > -1;
  if (c.hydration < 70) out.push(tIn(LG, "tom.water"));
  if (c.has.fibre && c.fibre < 70) out.push(tIn(LG, "tom.fibre"));
  if (c.has.comfort && c.comfort < 60) out.push(tIn(LG, "tom.comfort"));
  if (c.routine < 60) out.push(tIn(LG, "tom.routine"));
  if (has("constipation") || has("ibs-c")) out.push(tIn(LG, "tom.morning"));
  if (has("ibs-d")) out.push(tIn(LG, "tom.plain"));
  if (!out.length) out.push(tIn(LG, "tom.good"));
  return out.slice(0, 3);
}

function diagnose(err) {
  const m = (err && err.message) || String(err || "");
  if (/Failed to fetch|NetworkError|Load failed|Network request failed/i.test(m)) return t("ai.err.cors");

async function listModels() {

/* ---------- language + fuzzy understanding ---------- */
function normalize(s) {
  return (s || "").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "").normalize("NFC")
    .replace(/[^a-z0-9\u0600-\u06FF ]+/g, " ")
    .replace(/\s+/g, " ").trim();
}

function detectTextLang(s) {
  if (/[\u0600-\u06FF]/.test(s || "")) return "ar";
  const n = normalize(s);
  const fr = ["je", "jai", "tu", "il", "elle", "nous", "vous", "pourquoi", "comment", "quoi", "manger", "douleur", "ventre", "eau", "demain", "merci", "bonjour", "sante", "est", "pas", "avec", "pour", "mais", "trop", "faire", "chaque", "jour", "eviter", "puis", "mon", "ma", "mes", "mal", "au", "aux", "du", "des", "le", "la", "les", "ai", "suis", "peux", "besoin", "votre", "nuit", "selles", "gaz", "aujourdhui"];
  const toks = n.split(" ");
  const hits = fr.filter((w) => toks.indexOf(w) > -1).length;
  return hits >= 2 ? "fr" : "en";
}

function lev(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  let prev = new Array(n + 1);
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++) {
    let cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}

function stem(w) {
  return w.replace(/(ing|ed|es|s)$/, "");
}

function hasAny(tokens, words) {
  const joined = tokens.join(" ");
  for (let i = 0; i < words.length; i++) {
    const w = words[i];
    if (w.indexOf(" ") > -1) {
      if (joined.indexOf(w) > -1) return true;
      continue;
    }
    for (let k = 0; k < tokens.length; k++) {
      const t = tokens[k];
      if (t === w) return true;
      const latin = /^[a-z]+$/.test(t) && /^[a-z]+$/.test(w);
      if (latin && t.length > 2 && w.length > 2 && stem(t) === stem(w)) return true;
      if (latin && t.length > 3 && w.length > 3 && Math.abs(t.length - w.length) <= 2 && lev(t, w) <= 2) return true;
    }
  }
  return false;
}

function routineText(lg) {
  const p = state.profile;
  const has = (c) => p.conditions.indexOf(c) > -1;
  const items = [
    tIn(lg, "rt.wake"),
    tIn(lg, "rt.meals"),
    tIn(lg, "rt.fibre"),
    tIn(lg, "rt.walk"),
    tIn(lg, "rt.sleep")
  ];
  if (has("constipation") || has("ibs-c") || has("hemorrhoids")) items.push(tIn(lg, "rt.toilet"));
  if (has("ibs-d")) items.push(tIn(lg, "rt.plain"));
  if (has("gerd") || has("gastritis")) items.push(tIn(lg, "rt.upright"));
  if (has("lactose")) items.push(tIn(lg, "rt.dairy"));
  return tIn(lg, "rt.intro", { n: items.length }) + "\n\n" + items.map((x, i) => (i + 1) + ". " + x).join("\n") + "\n\n" + tIn(lg, "rt.outro");
}

function localCoach(text) {
  const lg = detectTextLang(text || LANG);
  const n = normalize(text);
  const tokens = n.split(" ").filter(Boolean);
  const c = computeDay(todayKey());
  const d = getDay(todayKey());
  const hit = (arr) => hasAny(tokens, arr);

  // 1. explaining itself
  if (hit(["why", "notice", "explain", "think", "analysis", "pattern", "pourquoi", "expliquer", "لماذا", "اشرح", "تحليل"])) {
    return noticingText(lg);
  }
  if (hit(["pain", "cramp", "ache", "hurt", "douleur", "mal", "ventre", "estomac", "ألم", "مغص", "وجع", "بطن", "معدة"])) return tIn(lg, "chat.pain");
  if (hit(["bloat", "gas", "swollen", "ballonn", "انتفاخ", "غازات"])) return tIn(lg, "chat.bloat");
  if (hit(["diarr", "loose", "إسهال", "liquide"])) return tIn(lg, "chat.diarr");
  if (hit(["constip", "إمساك", "constiper"])) return tIn(lg, "chat.constip");
  if (hit(["sleep", "tired", "insomnia", "نوم", "sommeil", "fatigue"])) return tIn(lg, "chat.sleep");
  if (hit(["doctor", "hospital", "médecin", "medecin", "طبيب", "مستشفى"])) return tIn(lg, "chat.doctor");
  // 2. the daily routine / prevention — the question people actually ask
  if (hit(["every", "everyday", "daily", "routine", "habit", "avoid", "prevent", "healthy", "each", "chaque", "quotidien", "eviter", "يوميا", "كل", "أفعل", "أتفادى", "روتين"]) ||
      n.indexOf("every day") > -1 || n.indexOf("each day") > -1 || n.indexOf("what should i do") > -1 || n.indexOf("que faire") > -1) {
    return routineText(lg);
  }
  if (hit(["tomorrow", "demain", "غدا", "غد"])) {
    return tIn(lg, "chat.tomorrow") + "\n\n" + tomorrowAdvice(lg).map((x) => "• " + x).join("\n") + "\n\n" + tIn(lg, "chat.ask1");
  }
  if (hit(["cook", "recipe", "prepare", "boil", "cuisiner", "recette", "طبخ", "أطبخ", "تحضير"])) return tIn(lg, "chat.cook") + "\n\n" + tIn(lg, "chat.ask1");
  if (hit(["eat", "food", "meal", "hungry", "manger", "repas", "أكل", "طعام", "وجبة", "آكل"])) {
    const ctx = gutContext(todayKey());
    const best = state.pantry.filter((id) => FOOD[id]).map((id) => ({ id: id, s: foodScore(FOOD[id], ctx) })).sort((a, b) => b.s - a.s).slice(0, 3);
    if (best.length) return tIn(lg, "chat.eat") + "\n\n" + best.map((b) => "• " + foodNameIn(lg, b.id) + " (" + b.s + ")").join("\n") + "\n\n" + tIn(lg, "chat.ask1");
  }
  if (hit(["water", "drink", "thirsty", "eau", "boire", "ماء", "أشرب"])) return tIn(lg, "chat.water", { n: d.water });
  if (hit(["walk", "exercise", "move", "marche", "sport", "مشي", "رياضة"])) return tIn(lg, "chat.walk");
  if (hit(["hello", "salam", "bonjour", "salut", "مرحبا", "سلام", "hi", "hey"])) return tIn(lg, "chat.hello");
  if (hit(["thanks", "thank", "merci", "شكرا"])) return tIn(lg, "chat.thanks");

  // 3. honest fallback — offer the AI for anything outside its lane
  const looksQuestion = /\?/.test(text) || hit(["what", "how", "when", "where", "who", "why", "which", "can", "is", "are", "do", "does", "comment", "quel", "quelle", "qui", "quand", "كيف", "ماذا", "ما", "هل", "لماذا", "متى", "أين", "كم"]);
  if (looksQuestion) return tIn(lg, "fb.ai") + "\n\n" + tIn(lg, "chat.summary", { s: c.logged ? c.overall : "—", w: d.water, f: c.fibreG || 0 });
  const picks = [tIn(lg, "fb.1"), tIn(lg, "fb.2"), tIn(lg, "fb.3")];
  const seed = (text || "").length + (text || "").charCodeAt(0);
  return picks[seed % 3] + "\n\n" + tIn(lg, "chat.summary", { s: c.logged ? c.overall : "—", w: d.water, f: c.fibreG || 0 });
}

  if (qid === "meal") {
    if (aid === "fine") d.log.bloating = 0;
    if (aid === "bloat") d.log.bloating = 2;
    if (aid === "pain") d.log.pain = 2;

  save(); render();
}

async function pushAndReply(text) {
  state.chat.push({ role: "user", text: text, ts: Date.now() });
  state.chat = state.chat.slice(-60);
  logEvent("chat", text);
  save(); render();
  window.scrollTo(0, document.body.scrollHeight);
  await new Promise((r) => setTimeout(r, 240));
  let reply;
  const ai = state.settings.ai;
  if (ai.key && ai.provider !== "none") {
    try {
      const hist = state.chat.slice(-14).map((m) => ({ role: m.role === "user" ? "user" : "assistant", content: m.text }));
      reply = await callModel(coachSystem(), hist);
    } catch (e) { reply = localCoach(text); }
  } else {
    reply = localCoach(text);
  }
  state.chat.push({ role: "coach", text: reply, ts: Date.now() });
  state.chat = state.chat.slice(-60);
  save(); render();
  window.scrollTo(0, document.body.scrollHeight);
}

function sendChat() {
  const inp = $("#chatInput");
  if (!inp) return;
  const v = (inp.value || "").trim();
  if (!v) return;
  inp.value = "";
  pushAndReply(v);
}

async function callModel(system, messages) {
  const ai = state.settings.ai;
  const p = providerById(ai.provider);
  if (p.kind === "none" || !ai.key) throw new Error("no key");
  const model = (ai.model || p.model || "").trim();

  if (p.kind === "gemini") {
    const url = "https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(model || "gemini-2.0-flash") + ":generateContent?key=" + encodeURIComponent(ai.key);
    const contents = messages.map((m) => ({ role: m.role === "user" ? "user" : "model", parts: [{ text: m.content }] }));
    const res = await fetch(url, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ systemInstruction: { parts: [{ text: system }] }, contents: contents, generationConfig: { temperature: 0.5, maxOutputTokens: 900 } })
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const j = await res.json();
    const out = ((j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || []).map((x) => x.text || "").join("");
    if (!out) throw new Error("empty");
    return out.trim();
  }

  let base = (p.id === "custom" ? (ai.baseUrl || "").trim() : p.url).replace(/\/+$/, "");
  if (!base) throw new Error("no url");
  const url = base.indexOf("/chat/completions") > -1 ? base : base + "/chat/completions";
  const headers = { "Content-Type": "application/json" };
  if (p.header === "api-subscription-key") headers["api-subscription-key"] = ai.key;
  else headers["Authorization"] = "Bearer " + ai.key;
  const res = await fetch(url, {
    method: "POST", headers: headers,
    body: JSON.stringify({ model: model, temperature: 0.5, max_tokens: 900, messages: [{ role: "system", content: system }].concat(messages) })
  });
  if (!res.ok) {
    let detail = "";
    try { detail = (await res.text()).slice(0, 90); } catch (e) {}
    throw new Error("HTTP " + res.status + " " + detail);
  }
  const j = await res.json();
  const out = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
  if (!out) throw new Error("empty");
  return out.trim();
}

function slotLabel(s) { return t("slot." + s) || "Meal"; }
function ensurePlan(k) {
  const d = getDay(k);
  if (!d.plan || !d.plan.length) { d.plan = buildPlan(k); save(); }
  return d.plan;
}
function foodWhy(f, ctx) {
  const fl = f.flags || [];
  if (fl.indexOf("gluten") > -1 && ctx.conditions.indexOf("celiac") > -1) return t("why.gluten");
  if (fl.indexOf("lactose") > -1 && ctx.conditions.indexOf("lactose") > -1) return t("why.lactose");
  if (f.fiber >= 3) return t("why.fiber");
  if (fl.indexOf("probiotic") > -1) return t("why.probiotic");
  if (fl.indexOf("fried") > -1) return t("why.fried");
  if (fl.indexOf("spicy") > -1) return t("why.spicy");
  if (f.fodmap >= 3) return t("why.fodmap");
  if (f.water >= 3) return t("why.hydrating");
  if (f.cat === "protein") return t("why.protein");
  if (f.res >= 3) return t("why.residue");
  return t("why.gentle");
}
function topAdvice(c, k) {
  const d = getDay(k);
  if (!c.logged) return t("advice.start");
  if (d.water < 5) return t("advice.water");
  if (c.has.fibre && c.fibre < 60) return t("advice.fibre");
  if (c.has.comfort && c.comfort < 55) return t("advice.comfort");
  if (c.routine < 60) return t("advice.routine");
  return t("advice.keep");
}

/* ============================================================
   INSIGHTS / BODY
   ============================================================ */
function analyse(days = 14, lang = null) {
  const LG = lang || LANG;
  const rows = [];
  for (let i = days - 1; i >= 0; i--) {
    const k = addDays(todayKey(), -i);
    rows.push({ k, d: getDay(k), c: computeDay(k) });
  }
  const logged = rows.filter((r) => r.c.logged);
  const out = { rows, logged, findings: [], days };

  if (logged.length === 0) {
    out.findings.push({ tone: "warn", title: tIn(LG, "find.none.title"), text: tIn(LG, "find.none.text") });
    return out;
  }

  const fib = logged.filter((r) => r.c.has.fibre);
  if (fib.length) {
    const avgG = Math.round(fib.reduce((a, r) => a + r.c.fibreG, 0) / fib.length);
    const lowDays = fib.filter((r) => r.c.fibreG < 20).length;
    out.findings.push({
      tone: avgG < 20 ? "bad" : avgG < 26 ? "warn" : "good",
      title: tIn(LG, "find.fibre.title", { g: avgG }),
      text: avgG < 20 ? tIn(LG, "find.fibre.bad", { n: lowDays, m: fib.length }) : avgG < 26 ? tIn(LG, "find.fibre.warn") : tIn(LG, "find.fibre.good")
    });
  }

  const wAvg = logged.reduce((a, r) => a + r.d.water, 0) / logged.length;
  out.findings.push({
    tone: wAvg < 4 ? "bad" : wAvg < 6 ? "warn" : "good",
    title: tIn(LG, "find.water.title", { v: Math.round(wAvg * 10) / 10 }),
    text: wAvg < 4 ? tIn(LG, "find.water.bad") : wAvg < 6 ? tIn(LG, "find.water.warn") : tIn(LG, "find.water.good")
  });

  const last7 = rows.slice(-7).filter((r) => r.c.has.comfort);
  const prev7 = rows.slice(0, 7).filter((r) => r.c.has.comfort);
  if (last7.length >= 2 && prev7.length >= 2) {
    const a1 = last7.reduce((a, r) => a + r.c.comfort, 0) / last7.length;
    const a0 = prev7.reduce((a, r) => a + r.c.comfort, 0) / prev7.length;
    const diff = Math.round(a1 - a0);
    out.findings.push({
      tone: diff > 4 ? "good" : diff < -4 ? "bad" : "warn",
      title: tIn(LG, "find.comfort.title", { d: (diff >= 0 ? "+" : "") + diff }),
      text: diff > 4 ? tIn(LG, "find.comfort.good") : diff < -4 ? tIn(LG, "find.comfort.bad") : tIn(LG, "find.comfort.same")
    });
  }

  const trig = ["fried", "fastfood", "spicy", "soda", "coffee"];
  let best = null;
  trig.forEach((x) => {
    const withT = logged.filter((r) => r.d.meals.some((m) => m.foodId === x) && r.c.has.comfort);
    const without = logged.filter((r) => !r.d.meals.some((m) => m.foodId === x) && r.c.has.comfort);
    if (withT.length >= 2 && without.length >= 2) {
      const aw = withT.reduce((a, r) => a + r.c.comfort, 0) / withT.length;
      const ao = without.reduce((a, r) => a + r.c.comfort, 0) / without.length;
      const gap = Math.round(ao - aw);
      if (gap > 6 && (!best || gap > best.gap)) best = { t: x, gap: gap, n: withT.length };
    }
  });
  if (best) {
    const fn2 = foodName(best.t).toLowerCase();
    out.findings.push({
      tone: "bad",
      title: tIn(LG, "find.trigger.title", { f: fn2 }),
      text: tIn(LG, "find.trigger.text", { n: best.n, f: fn2, g: best.gap })
    });
  }

  const bs = logged.filter((r) => r.d.log && r.d.log.bristol).map((r) => Number(r.d.log.bristol));
  if (bs.length >= 3) {
    const hard = bs.filter((b) => b <= 2).length, ideal = bs.filter((b) => b === 3 || b === 4).length, loose = bs.filter((b) => b >= 6).length;
    const ph = Math.round((hard / bs.length) * 100), pi = Math.round((ideal / bs.length) * 100), pl = Math.round((loose / bs.length) * 100);
    out.findings.push({
      tone: ideal / bs.length >= 0.6 ? "good" : "warn",
      title: tIn(LG, "find.stool.title", { h: ph, i: pi, l: pl }),
      text: hard > loose ? tIn(LG, "find.stool.hard") : loose > hard ? tIn(LG, "find.stool.loose") : tIn(LG, "find.stool.mixed")
    });
  }

  const rut = logged.reduce((a, r) => a + r.c.routine, 0) / logged.length;
  out.findings.push({
    tone: rut > 70 ? "good" : rut > 45 ? "warn" : "bad",
    title: tIn(LG, "find.routine.title", { r: Math.round(rut) }),
    text: rut > 70 ? tIn(LG, "find.routine.good") : tIn(LG, "find.routine.low")
  });

  const flag = logged.slice(-3).some((r) => r.d.log && (r.d.log.blood || r.d.log.fever));
  if (flag) out.findings.unshift({ tone: "bad", title: tIn(LG, "find.flag.title"), text: tIn(LG, "find.flag.text") });
  return out;
}

let toastT;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ============================================================
   ACTIONS
   ============================================================ */
document.addEventListener("pointerdown", () => { audioCtx(); }, { once: true });
document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  const k = todayKey();

  switch (act) {
    case "tab": ui.tab = el.dataset.tab; ui.sub = null; render(); break;
    case "setLang": setLang(el.dataset.lang); break;
    case "nowDone": markRhythm(el.dataset.id); render(); if (ui.sub === "checkin") render(); break;
    case "nowLater": postponeItem(el.dataset.id); render(); toast(t("toast.later")); break;
    case "chatSend": sendChat(); break;
    case "askWhy": { ui.tab = "coach"; ui.sub = null; pushAndReply(t("chat.why.q")); break; }
    case "answer": answerQuestion(el.dataset.q, el.dataset.a, el.dataset.l); break;
    case "askTomorrow": {
      ui.tab = "coach"; ui.sub = null;
      state.chat.push({ role: "user", text: t("chat.tomorrow.q") });
      state.chat.push({ role: "coach", text: t("chat.tomorrow") + "\n\n" + tomorrowAdvice().map((x) => "• " + x).join("\n") });
      save(); render(); break;
    }
    case "alarmStop": stopAlarm(false); break;
    case "alarmAte": stopAlarm(true); break;
    case "alarmSnooze": snoozeAlarm(); break;
    case "setSound": state.settings.sound = el.dataset.mode; save(); render(); break;
    case "testAlarm": {
      fireAlarm({ key: "test|" + Date.now(), title: t("alarm.title"), body: t("alarm.test.body"), time: nowHM(), foodId: null });
      break;
    }
    case "sub": ui.sub = el.dataset.sub; render(); break;
    case "back": ui.sub = null; render(); break;

    /* --- onboarding --- */
    case "obNext": {
      const ob = ui.ob;
      if (ob.step === 0) { ob.step = 1; }
      else if (ob.step === 1) {
        ob.answers.name = ($("#obName") || {}).value || "";
        ob.answers.age = Number(($("#obAge") || {}).value) || null;
        ob.answers.sex = ($("#obSex") || {}).value || "";
        ob.answers.height = Number(($("#obHt") || {}).value) || null;
        ob.answers.weight = Number(($("#obWt") || {}).value) || null;
        ob.qIdx = 0; ob.step = 2;
      } else if (ob.step === 2) { ob.step = 3; }
      else if (ob.step === 3) {
        if (!(ob.answers.conditions || []).length) { toast(t("toast.pickone")); return; }
        ob.answers.pantry = state.pantry.slice(); ob.step = 4;
      }
      render(); break;
    }
    case "obBack": {
      const ob = ui.ob;
      if (ob.step === 2 && (ob.qIdx || 0) > 0) ob.qIdx--;
      else ob.step = Math.max(0, ob.step - 1);
      render(); break;
    }
    case "obPrevQ": ui.ob.qIdx = Math.max(0, (ui.ob.qIdx || 0) - 1); render(); break;
    case "obAns": {
      const ob = ui.ob; const q = QUIZ[ob.qIdx || 0];
      ob.answers[q.id] = Number(el.dataset.i);
      if ((ob.qIdx || 0) < QUIZ.length - 1) { ob.qIdx = (ob.qIdx || 0) + 1; }
      else { ob.sugg = suggestConditions(ob.answers); ob.step = 3; }
      render(); break;
    }
    case "quizAns": {
      const ob = ui.ob; const q = QUIZ[ob.qIdx || 0];
      ob.answers[q.id] = Number(el.dataset.i);
      if ((ob.qIdx || 0) < QUIZ.length - 1) ob.qIdx++;
      else {
        const sugg = suggestConditions(ob.answers);
        state.profile.conditions = sugg.map((s) => s.id).slice(0, 1);
        save(); ui.sub = null; ui.tab = "settings";
        toast(t("toast.suggested", { s: sugg.map((x) => condName(x.id)).join(", ") }));
      }
      render(); break;
    }
    case "obToggleCond": {
      const ob = ui.ob; ob.answers.conditions = ob.answers.conditions || [];
      const i = ob.answers.conditions.indexOf(el.dataset.id);
      if (i > -1) ob.answers.conditions.splice(i, 1); else ob.answers.conditions.push(el.dataset.id);
      render(); break;
    }
    case "obPickSugg": {
      const ob = ui.ob; ob.answers.conditions = ob.answers.conditions || [];
      const id = el.dataset.id;
      if (ob.answers.conditions.indexOf(id) === -1) ob.answers.conditions.push(id);
      render(); break;
    }
    case "obTogglePantry": {
      const ob = ui.ob; ob.answers.pantry = ob.answers.pantry || [];
      const i = ob.answers.pantry.indexOf(el.dataset.id);
      if (i > -1) ob.answers.pantry.splice(i, 1); else ob.answers.pantry.push(el.dataset.id);
      render(); break;
    }
    case "obFinish": {
      const a = ui.ob.answers;
      state.profile = Object.assign(state.profile, {
        name: a.name || "", age: a.age, sex: a.sex, height: a.height, weight: a.weight,
        conditions: a.conditions || [], onboarded: true,
        redFlag: a.blood === 1 || a.fever === 1
      });
      state.pantry = a.pantry || [];
      getDay(k).plan = buildPlan(k);
      save(); ui.tab = "now"; ui.sub = null;
      render(); toast(t("toast.ready"));
      break;
    }

    /* --- daily --- */
    case "toggleTask": {
      const d = getDay(k); const id = el.dataset.id;
      d.tasks[id] = !d.tasks[id]; save(); render(); break;
    }
    case "water": {
      const d = getDay(k); const n = Number(el.dataset.n);
      d.water = (d.water === n) ? n - 1 : n; logEvent("water", "set to " + d.water + "/8"); save(); render(); break;
    }
    case "toggleMeal": {
      const d = getDay(k);
      const key = el.dataset.key;
      const idx = d.meals.findIndex((m) => m.key === key);
      if (idx > -1) d.meals.splice(idx, 1);
      else { d.meals.push({ id: uid(), foodId: el.dataset.food, slot: el.dataset.slot, time: el.dataset.time, key: key }); logEvent("food", (FOOD[el.dataset.food] ? FOOD[el.dataset.food].name : el.dataset.food) + " (" + el.dataset.slot + ")"); }
      save(); render(); break;
    }
    case "delMeal": {
      const d = getDay(k);
      d.meals = d.meals.filter((m) => m.id !== el.dataset.id);
      save(); render(); break;
    }
    case "addFood": {
      const d = getDay(k);
      d.meals.push({ id: uid(), foodId: el.dataset.id, slot: ($("#amSlot") || {}).value || "lunch", time: nowHM(), source: "extra" });
      logEvent("food", (FOOD[el.dataset.id] ? FOOD[el.dataset.id].name : el.dataset.id) + " (added)");
      save(); ui.sub = null; render(); toast(t("toast.added", { f: foodName(el.dataset.id) })); break;
    }
    case "replan": {

    }

    case "togglePantry": {
      const id = el.dataset.id; const i = state.pantry.indexOf(id);

      save(); ui.sub = null; ui.tab = "now"; render();

    case "logSeg": {

    case "saveProfile": {

    case "askNotif": {

    case "genReport": { await generateReport(el); break; }
    case "findModels": {

    }
    case "pickModel": {
      state.settings.ai.model = el.dataset.model;
      state.settings.ai.key = (($("#aiKey") || {}).value || state.settings.ai.key || "").trim();
      save(); render();

    case "ics": { downloadICS(); break; }
    case "export": {

      const a = document.createElement("a");

        localStorage.removeItem(STORE_KEY); load(); ui = { tab: "now", sub: null, arg: null, ob: { step: 0, answers: {}, sugg: [] } };

      }
      break;
    }
  }
});

function summaryText() {
  const an = analyse(14);
  const rows = an.logged.slice(-14).map((r) => {
    const l = r.d.log || {};
    return [
      r.k,
      "bristol=" + (l.bristol || "-"),
      "pain=" + (l.pain != null ? l.pain : "-"),
      "bloat=" + (l.bloating != null ? l.bloating : "-"),
      "water=" + r.d.water,
      "fibre_g=" + (r.c.fibreG || 0),
      "comfort=" + (r.c.has.comfort ? r.c.comfort : "-"),
      "foods=" + r.d.meals.map((m) => foodName(m.foodId)).join("|")
    ].join(" ");
  });
  return "PROFILE: age=" + (state.profile.age || "?") + " sex=" + (state.profile.sex || "?") +
    " conditions=" + state.profile.conditions.join(",") +
    "\nPANTRY: " + state.pantry.map(foodName).join(", ") +
    "\nDAILY (last 14):\n" + rows.join("\n") +
    "\nFINDINGS:\n" + an.findings.map((f) => "- " + f.title + ": " + f.text).join("\n");
}

function localReport() {
  const an = analyse(14);
  const p = state.profile;
  const conds = p.conditions.map(condFull).join(", ") || t("rep.conds");
  const L = [];
  L.push(t("rep.title", { d: prettyDate(todayKey()) }));
  L.push(t("rep.focus", { c: conds, n: an.logged.length }));
  L.push("");
  L.push(t("rep.what"));
  an.findings.slice(0, 3).forEach((f) => L.push("• " + f.title + " — " + f.text));
  L.push("");
  L.push(t("rep.do"));
  const c = computeDay(todayKey());
  const acts = [];
  if (c.hydration < 70) acts.push(t("rep.a1"));
  if (c.has.fibre && c.fibre < 70) acts.push(t("rep.a2"));
  if (p.conditions.indexOf("constipation") > -1 || p.conditions.indexOf("ibs-c") > -1) acts.push(t("rep.a3"));
  if (p.conditions.indexOf("ibs-d") > -1) acts.push(t("rep.a4"));
  acts.push(t("rep.a5"));
  acts.push(t("rep.a6"));
  acts.forEach((a, i) => L.push((i + 1) + ". " + a));
  L.push("");
  L.push(t("rep.watch"));
  L.push(t("rep.watch.text"));
  return L.join("\n");
}

async function generateReport(btn) {
  const ai = state.settings.ai;
  btn = btn || $("#genBtn");
  if (btn) { btn.disabled = true; btn.textContent = "Writing…"; }
  try {
    let text, source;
    if (ai.key && ai.provider !== "none") {
      text = await callAI(summaryText()); source = ai.provider === "gemini" ? t("report.source.gemini") : t("report.source.openai");
    } else {
      await new Promise((r) => setTimeout(r, 500));
      text = localReport(); source = t("report.source.local");
    }
    state.reports.unshift({ id: uid(), date: todayKey(), source: source, text: text });
    state.reports = state.reports.slice(0, 20);
    save(); render(); toast(t("toast.report"));
  } catch (err) {
    toast(t("toast.aifail"));
    state.reports.unshift({ id: uid(), date: todayKey(), source: t("report.source.local"), text: localReport() });
    save(); render();
  }
}

async function callAI(payload) {
  const langName = LANG === "fr" ? "French" : LANG === "ar" ? "Arabic (Modern Standard)" : "English";
  const sys = "You are a careful gut-health assistant writing for one person with a colon condition, in a low-resource setting with limited food variety. Use ONLY the data given. Be concrete, warm and brief. Write the entire answer in " + langName + ". Structure: WHAT YOUR DATA SHOWS (3 short bullets), LIKELY DRIVERS, THIS WEEK'S PLAN (4 numbered actions using only foods in their pantry), WHEN TO SEE A DOCTOR. Never diagnose, never prescribe medicine or doses. 220 words maximum.";
  return callModel(sys, [{ role: "user", content: payload }]);
}

function downloadICS() {
  const times = SLOTS.map((s) => [s.time, s.label + " — GutCare"]);
  times.push(["20:30", "GutCare check-in"]);
  const dt = todayKey().replace(/-/g, "");
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//GutCare//EN", "CALSCALE:GREGORIAN"];
  times.forEach(([t, title], i) => {
    const hm = t.replace(":", "") + "00";
    lines.push("BEGIN:VEVENT", "UID:gutcare-" + i + "-" + dt + "@local", "DTSTAMP:" + dt + "T000000Z",
      "DTSTART:" + dt + "T" + hm, "DURATION:PT15M", "RRULE:FREQ=DAILY",
      "SUMMARY:" + title, "DESCRIPTION:Eat what your plan says. Log it in GutCare.", "BEGIN:VALARM", "TRIGGER:-PT5M", "ACTION:DISPLAY", "DESCRIPTION:" + title, "END:VALARM", "END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  const blob = new Blob([lines.join("\r\n")], { type: "text/calendar" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "gutcare-reminders.ics"; a.click();
  toast(t("toast.ics"));
}

/* ============================================================
   ALARM ENGINE — sound, vibration, overlay
   ============================================================ */
const ICON = "data:image/svg+xml;utf8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0f766e"/><path d="M18 22c0 12 28 10 28 22" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="46" cy="46" r="4" fill="#fff"/></svg>');

let AC = null, beepTimer = null, wakeLock = null, beepsLeft = 0;

function audioCtx() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
  } catch (e) { AC = null; }
  return AC;
}

function chirp() {
  const ac = audioCtx();
  if (!ac) return;
  const t0 = ac.currentTime;
  [0, 0.19].forEach((off, i) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "sine";
    o.frequency.value = i === 0 ? 880 : 1180;
    g.gain.setValueAtTime(0.0001, t0 + off);
    g.gain.exponentialRampToValueAtTime(0.42, t0 + off + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.16);
    o.connect(g); g.connect(ac.destination);
    o.start(t0 + off); o.stop(t0 + off + 0.18);
  });
}

function buzz() {
  if (navigator.vibrate) { try { navigator.vibrate([320, 160, 320, 160, 320]); } catch (e) {} }
}

function startSound() {
  stopSound();
  const mode = state.settings.sound || "ten";
  if (mode === "silent") return;
  if (mode === "loop") {
    chirp(); buzz();
    beepTimer = setInterval(() => { chirp(); buzz(); }, 1600);
  } else {
    beepsLeft = 10;
    chirp(); buzz(); beepsLeft--;
    beepTimer = setInterval(() => {
      if (beepsLeft <= 0) { stopSound(); return; }
      chirp(); beepsLeft--;
    }, 420);
  }
}

function stopSound() {
  if (beepTimer) { clearInterval(beepTimer); beepTimer = null; }
  beepsLeft = 0;
  if (navigator.vibrate) { try { navigator.vibrate(0); } catch (e) {} }
}

async function keepAwake() {
  try {
    if ("wakeLock" in navigator && document.visibilityState === "visible") {
      wakeLock = await navigator.wakeLock.request("screen");
    }
  } catch (e) { wakeLock = null; }
}
function releaseAwake() {
  try { if (wakeLock) wakeLock.release(); } catch (e) {}
  wakeLock = null;
}

function fireAlarm(item) {
  ui.alarm = item;
  state.settings.fired[item.key] = true;
  save();
  if ("Notification" in window && Notification.permission === "granted") {
    try {
      const n = new Notification(item.title, {
        body: item.body, tag: "gutcare-" + item.key, renotify: true,
        requireInteraction: true, icon: ICON, badge: ICON,
        vibrate: [320, 160, 320, 160, 320], silent: false
      });
      n.onclick = () => { window.focus(); n.close(); };
    } catch (e) {}
  }
  startSound();
  keepAwake();
  render();
}

function stopAlarm(ate) {
  const a = ui.alarm;
  stopSound(); releaseAwake();
  ui.alarm = null;
  if (a) {
    state.settings.snooze = (state.settings.snooze || []).filter((x) => x.key !== a.key);
    if (ate && a.foodId) {
      const d = getDay(todayKey());
      if (!d.meals.some((m) => m.key === a.key)) {
        d.meals.push({ id: uid(), foodId: a.foodId, slot: a.slot, time: a.time, key: a.key });
        logEvent("food", (FOOD[a.foodId] ? FOOD[a.foodId].name : a.foodId) + " (from alarm)");
      }
    }
  }
  save(); render();
  if (ate) toast(t("toast.logsaved"));
}

function snoozeAlarm() {
  const a = ui.alarm;
  if (!a) return;
  stopSound(); releaseAwake();
  ui.alarm = null;
  state.settings.snooze = (state.settings.snooze || []).filter((x) => x.key !== a.key);
  state.settings.snooze.push({ key: a.key, title: a.title, body: a.body, time: a.time, foodId: a.foodId, slot: a.slot, until: Date.now() + 10 * 60 * 1000 });
  save(); render();
  toast("+10 min");
}

function alarmOverlay() {
  const a = ui.alarm;
  if (!a) return "";
  return '<div class="alarm" role="alertdialog" aria-label="Alarm"><div class="alarm-inner">' +
    '<div class="alarm-time">' + esc(a.time || nowHM()) + "</div>" +
    "<h2>" + esc(a.title) + "</h2>" +
    "<p>" + esc(a.body || "") + "</p>" +
    '<button class="btn btn-primary btn-block" data-act="alarmStop">' + esc(t("alarm.stop")) + "</button>" +
    '<button class="btn btn-block" data-act="alarmSnooze">' + esc(t("alarm.snooze")) + "</button>" +
    (a.foodId ? '<button class="btn btn-block" data-act="alarmAte">' + esc(t("alarm.ate")) + "</button>" : "") +
    "</div></div>";
}

/* ============================================================
   REMINDER LOOP
   ============================================================ */
function reminderLoop() {
  if (!state || !state.profile.onboarded) return;
  if (ui.alarm) return;
  if (!state.settings.remind) return;

  const now = new Date(), k = todayKey(), d = getDay(k);

  const sn = state.settings.snooze || [];
  const due = sn.filter((x) => Date.now() >= x.until);
  if (due.length) {
    state.settings.snooze = sn.filter((x) => Date.now() < x.until);
    save();
    fireAlarm(due[0]);
    return;
  }

  const items = [];
  const past = (hm, win) => {
    const p = hm.split(":").map(Number);
    const sched = new Date(); sched.setHours(p[0], p[1], 0, 0);
    const diff = (now - sched) / 60000;
    return diff >= 0 && diff <= win;
  };

  (d.plan || []).forEach((p) => {
    const key = k + "|" + p.slot + "|" + p.foodId;
    if (state.settings.fired[key]) return;
    if (d.meals.some((m) => m.key === p.slot + ":" + p.foodId)) return;
    if (!past(p.time, 45)) return;
    items.push({ key: key, title: t("alarm.title"), body: foodName(p.foodId) + " · " + slotLabel(p.slot), foodId: p.foodId, slot: p.slot, time: p.time });
  });

  if (d.water < 8) {
    ["11:00", "16:00"].forEach((tm) => {
      const key = k + "|water|" + tm;
      if (state.settings.fired[key] || !past(tm, 30)) return;
      items.push({ key: key, title: t("alarm.water.title"), body: t("alarm.water.body", { n: d.water }), time: tm });
    });
  }

  if (!d.log && !state.settings.fired[k + "|checkin"] && past("20:30", 60)) {
    items.push({ key: k + "|checkin", title: t("alarm.checkin.title"), body: t("alarm.checkin.body"), time: "20:30" });
  }

  if (items.length) fireAlarm(items[0]);
}

/* ============================================================

   ============================================================ */
load();
LANG = state.settings.lang || detectLang();
state.settings.lang = LANG;
if (state.profile.onboarded) getDay(todayKey());
render();
setInterval(reminderLoop, 25000);
reminderLoop();
</script>
